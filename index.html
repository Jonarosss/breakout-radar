
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Breakout Radar - BSC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #101827;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }

    h1 {
      color: #f0b90b;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #94a3b8;
      margin-top: 0;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      margin-top: 20px;
    }

    button {
      background: #f0b90b;
      color: #111827;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .status {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 15px;
    }

    .pool {
      padding: 14px 0;
      border-bottom: 1px solid #475569;
    }

    .pool-name {
      font-weight: bold;
      color: #f0b90b;
      overflow-wrap: anywhere;
    }

    .pool-details {
      font-size: 13px;
      line-height: 1.8;
      color: #cbd5e1;
      overflow-wrap: anywhere;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #f87171;
    }
  </style>
</head>

<body>

  <h1>Breakout Radar</h1>
  <p class="subtitle">BNB Smart Chain Scanner</p>

  <div class="card">
    <h2>Scanner V1</h2>
    <p>Network: BSC Mainnet</p>

    <button id="scanButton" onclick="scanBSC()">
      Scan BSC
    </button>

    <p id="status" class="status">
      Ready to scan
    </p>
  </div>

  <div id="results" class="card" hidden></div>

  <script>
    async function scanBSC() {
      const button =
        document.getElementById("scanButton");

      const status =
        document.getElementById("status");

      const results =
        document.getElementById("results");

      button.disabled = true;
      status.className = "status";
      status.textContent = "Scanning BSC pools...";

      results.hidden = true;
      results.replaceChildren();

      try {
        const url =
          "https://api.geckoterminal.com/api/v2/" +
          "networks/bsc/trending_pools";

        const response = await fetch(url, {
          headers: {
            "Accept": "application/json"
          },
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            "API returned HTTP " + response.status
          );
        }

        const json = await response.json();

        if (!Array.isArray(json.data)) {
          throw new Error("Unexpected API response");
        }

        const pools = json.data;

        if (pools.length === 0) {
          status.textContent =
            "No BSC pools returned. Try again later.";
          return;
        }

        const heading = document.createElement("h3");
        heading.textContent =
          "Found " + pools.length + " BSC pools";

        results.appendChild(heading);

        pools.slice(0, 20).forEach(pool => {
          const a = pool.attributes || {};

          const card = document.createElement("div");
          card.className = "pool";

          const name = document.createElement("div");
          name.className = "pool-name";
          name.textContent =
            a.name || "Unknown pool";

          const details =
            document.createElement("div");
          details.className = "pool-details";

          const price =
            Number(a.base_token_price_usd);

          const liquidity =
            Number(a.reserve_in_usd);

          const volume =
            Number(a.volume_usd?.h24);

          function money(value, digits = 2) {
            if (!Number.isFinite(value)) {
              return "N/A";
            }

            return "$" + value.toLocaleString(
              "en-US", {
                maximumFractionDigits: digits
              }
            );
          }

          details.textContent =
            "Price: " +
            (Number.isFinite(price) && price > 0
              ? "$" + price.toPrecision(6)
              : "N/A") +
            " | Liquidity: " +
            money(liquidity) +
            " | 24h Volume: " +
            money(volume);

          card.append(name, details);
          results.appendChild(card);
        });

        results.hidden = false;

        status.className = "status success";
        status.textContent =
          "Scan completed successfully!";

      } catch (error) {
        status.className = "status error";
        status.textContent =
          "Scanner error: " + error.message;
      } finally {
        button.disabled = false;
      }
    }
  </script>

</body>
</html>
