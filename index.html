
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Breakout Radar · BSC</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px 16px 50px;background:#101827;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:680px;margin:auto}
h1{color:#f0b90b;margin:0 0 5px}
.sub,.muted{color:#94a3b8}
.sub{margin-top:0}
.panel,.pool{background:#1e293b;border-radius:16px;padding:17px;margin-top:15px}
button{background:#f0b90b;color:#111827;border:0;border-radius:10px;padding:12px 14px;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.5}
.scan{width:100%;margin-top:10px}
.pool h3{margin:0 0 9px;color:#f0b90b;overflow-wrap:anywhere}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:13px 0}
.label{display:block;font-size:12px;color:#94a3b8;margin-bottom:3px}
.value{font-weight:600;overflow-wrap:anywhere}
.up{color:#4ade80}
.down{color:#fb7185}
.address{font-size:12px;overflow-wrap:anywhere;background:#0f172a;padding:10px;border-radius:8px;margin:8px 0}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions a,.pool-link{color:#f0b90b;font-weight:600;font-size:14px}
.status{font-size:14px;color:#cbd5e1;white-space:pre-line}
.warning{color:#fbbf24;font-size:13px}
.tag{display:inline-block;font-size:11px;color:#cbd5e1;background:#334155;padding:4px 7px;border-radius:6px;margin-right:5px;margin-bottom:5px}
.score-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 7px}
.score-number{font-size:23px;font-weight:800}
.score-track{height:9px;border-radius:20px;background:#475569;overflow:hidden}
.score-fill{height:100%;border-radius:20px}
small{color:#94a3b8}
</style>
</head>
<body>
<main>
<h1>Breakout Radar</h1>
<p class="sub">BNB Smart Chain · DEX Discovery</p>

<section class="panel">
<strong>Scanner V1.3</strong>
<p class="muted">Trending · New · High volume</p>
<button id="scan" class="scan">Scan BSC</button>
<p id="status" class="status">Ready to scan.</p>
<small>
Experimental breakout scoring. Market cap may be
unavailable. Pool age is not token launch age.
No contract safety checks yet.
</small>
</section>

<div id="results"></div>
</main>

<script>
'use strict';

const API='https://api.geckoterminal.com/api/v2';

const feeds=[
 ['Trending','/networks/bsc/trending_pools'],
 ['New','/networks/bsc/new_pools'],
 ['High volume','/networks/bsc/pools?sort=h24_volume_usd_desc']
];

// Known BSC major-asset contract addresses.
// This is not a complete registry of all wrapped assets.
const MAJOR=new Set([
 // WBNB
 '0xbb4cdb9cbd36b01bd1cbaebf2de08d9173bc095c',
 // USDT
 '0x55d398326f99059ff775485246999027b3197955',
 // USDC
 '0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d',
 // BUSD
 '0xe9e7cea3dedca5984780bafc599bd69add087d56',
 // BTCB
 '0x7130d2a12b9bcbbfae4f2634d864a1ee1ce3ead9',
 // Binance-Peg ETH
 '0x2170ed0880ac9a755fd29b2688956bd959f933f8',
 // DAI
 '0x1afd23bcfbf3a0d65ad6c65bd01dbb5e59a86e72'
]);

const $=id=>document.getElementById(id);

function addressFromId(id){
 if(typeof id!=='string')return null;
 const match=id.match(/0x[a-fA-F0-9]{40}$/);
 return match?match[0]:null;
}

function num(value){
 if(value===null||value===undefined||value===''){
  return NaN;
 }
 const n=Number(value);
 return Number.isFinite(n)?n:NaN;
}

function usd(value){
 const n=num(value);
 if(!Number.isFinite(n))return 'N/A';
 if(n>0&&n<0.0001)return '$'+n.toPrecision(4);
 return '$'+n.toLocaleString('en-US',{
  maximumFractionDigits:n<1?6:2
 });
}

function compactUsd(value){
 const n=num(value);
 if(!Number.isFinite(n)||n<0)return 'N/A';
 if(n>=1e9)return '$'+(n/1e9).toFixed(2)+'B';
 if(n>=1e6)return '$'+(n/1e6).toFixed(2)+'M';
 if(n>=1e3)return '$'+(n/1e3).toFixed(1)+'K';
 return usd(n);
}

function tokenAddresses(pool){
 const r=pool.relationships||{};
 return {
  base:addressFromId(r.base_token?.data?.id),
  quote:addressFromId(r.quote_token?.data?.id)
 };
}

function identifyToken(pool){
 const {base,quote}=tokenAddresses(pool);
 if(!base||!quote)return null;

 const baseMajor=MAJOR.has(base.toLowerCase());
 const quoteMajor=MAJOR.has(quote.toLowerCase());

 // Exclude major-asset-only pairs.
 if(baseMajor&&quoteMajor)return {
  excluded:true
 };

 // The smaller token is usually the one we want.
 if(baseMajor&&!quoteMajor){
  return {
   address:quote,
   side:'quote',
   ambiguous:false
  };
 }

 if(quoteMajor&&!baseMajor){
  return {
   address:base,
   side:'base',
   ambiguous:false
  };
 }

 // Two non-major tokens: do not assume certainty.
 return {
  address:base,
  side:'base',
  ambiguous:true
 };
}

function poolAge(created){
 if(!created)return 'N/A';

 const time=Date.parse(created);
 if(!Number.isFinite(time))return 'N/A';

 const elapsed=Date.now()-time;
 if(elapsed<0)return 'N/A';

 const days=Math.floor(elapsed/86400000);
 if(days===0){
  const hours=Math.floor(elapsed/3600000);
  return hours<1?'< 1 hour':hours+' hours';
 }
 return days+' days';
}

function scorePool(pool){
 const a=pool.attributes||{};
 const change=num(a.price_change_percentage?.h24);
 const volume=num(a.volume_usd?.h24);
 const liquidity=num(a.reserve_in_usd);

 const ratio=
  Number.isFinite(volume)&&
  Number.isFinite(liquidity)&&
  liquidity>0
  ?volume/liquidity:NaN;

 let score=0;

 if(Number.isFinite(change)&&change>=-5&&change<=15){
  score+=25;
 }
 if(Number.isFinite(volume)&&volume>=50000){
  score+=25;
 }
 if(Number.isFinite(liquidity)&&liquidity>=25000){
  score+=25;
 }
 if(Number.isFinite(ratio)&&ratio>=0.5){
  score+=25;
 }

 return {score,ratio};
}

async function loadFeed(label,path){
 const response=await fetch(API+path,{
  headers:{Accept:'application/json'},
  cache:'no-store'
 });

 if(!response.ok){
  throw new Error('HTTP '+response.status);
 }

 const json=await response.json();
 if(!Array.isArray(json.data)){
  throw new Error('Unexpected response');
 }

 return json.data.map(pool=>({...pool,feed:label}));
}

async function copyContract(address,button){
 try{
  if(navigator.clipboard&&window.isSecureContext){
   await navigator.clipboard.writeText(address);
  }else{
   const field=document.createElement('textarea');
   field.value=address;
   field.style.position='fixed';
   field.style.opacity='0';
   document.body.append(field);
   field.select();
   const success=document.execCommand('copy');
   field.remove();
   if(!success)throw new Error('Copy unavailable');
  }

  button.textContent='Copied!';
  setTimeout(()=>{
   button.textContent='Copy contract';
  },1600);

 }catch(error){
  alert('Copy failed. Long-press the address to copy.');
 }
}

function metric(grid,label,value,cls=''){
 const box=document.createElement('div');
 const heading=document.createElement('span');
 heading.className='label';
 heading.textContent=label;

 const text=document.createElement('span');
 text.className='value '+cls;
 text.textContent=value;

 box.append(heading,text);
 grid.append(box);
}

function render(pool,token,signal){
 const a=pool.attributes||{};
 const card=document.createElement('article');
 card.className='pool';

 const name=document.createElement('h3');
 name.textContent=a.name||'Unnamed pool';
 card.append(name);

 for(const text of [pool.feed,'BSC']){
  const tag=document.createElement('span');
  tag.className='tag';
  tag.textContent=text;
  card.append(tag);
 }

 const scoreRow=document.createElement('div');
 scoreRow.className='score-row';

 const scoreLabel=document.createElement('strong');
 scoreLabel.textContent='Breakout Score';

 const scoreValue=document.createElement('span');
 scoreValue.className='score-number';
 scoreValue.textContent=signal.score+'/100';

 const color=
  signal.score>=75?'#4ade80':
  signal.score>=50?'#f0b90b':'#fb7185';

 scoreValue.style.color=color;
 scoreRow.append(scoreLabel,scoreValue);
 card.append(scoreRow);

 const track=document.createElement('div');
 track.className='score-track';

 const fill=document.createElement('div');
 fill.className='score-fill';
 fill.style.width=signal.score+'%';
 fill.style.background=color;

 track.append(fill);
 card.append(track);

 const grid=document.createElement('div');
 grid.className='metrics';

 const change=num(a.price_change_percentage?.h24);

 // Pool market cap is generally associated with
 // its base token. Do not label it as quote-token
 // market cap when the quote token is selected.
 const marketCap=token?.side==='base'
  ?compactUsd(a.market_cap_usd)
  :'N/A';

 metric(grid,'Market cap',marketCap);
 metric(grid,'Pool age',poolAge(a.pool_created_at));

 metric(
  grid,
  '24h price change (base)',
  Number.isFinite(change)
   ?(change>0?'+':'')+change.toFixed(2)+'%'
   :'N/A',
  Number.isFinite(change)
   ?change>=0?'up':'down':''
 );

 metric(
  grid,'Base token price',
  usd(a.base_token_price_usd)
 );

 metric(grid,'Liquidity',usd(a.reserve_in_usd));
 metric(grid,'24h volume',usd(a.volume_usd?.h24));

 metric(
  grid,'Volume / liquidity',
  Number.isFinite(signal.ratio)
   ?signal.ratio.toFixed(2)+'x':'N/A'
 );

 card.append(grid);

 const label=document.createElement('span');
 label.className='label';
 label.textContent='Token contract (BEP-20)';
 card.append(label);

 if(token){
  const address=document.createElement('div');
  address.className='address';
  address.textContent=token.address;
  card.append(address);

  const actions=document.createElement('div');
  actions.className='actions';

  const copy=document.createElement('button');
  copy.textContent='Copy contract';
  copy.addEventListener('click',()=>{
   copyContract(token.address,copy);
  });
  actions.append(copy);

  const explorer=document.createElement('a');
  explorer.href=
   'https://bscscan.com/token/'+
   encodeURIComponent(token.address);
  explorer.target='_blank';
  explorer.rel='noopener noreferrer';
  explorer.textContent='BscScan';
  actions.append(explorer);

  card.append(actions);

  if(token.ambiguous){
   const warning=document.createElement('p');
   warning.className='warning';
   warning.textContent=
    'Two non-major tokens. Base selected; '+
    'verify the intended contract before trading.';
   card.append(warning);
  }

  if(token.side==='quote'){
   const warning=document.createElement('p');
   warning.className='warning';
   warning.textContent=
    'Quote token selected. Base-token price, '+
    '24h change and pool market cap may not '+
    'describe the selected token.';
   card.append(warning);
  }
 }else{
  const warning=document.createElement('p');
  warning.className='warning';
  warning.textContent=
   'Token identity unavailable. Copy disabled.';
  card.append(warning);
 }

 const poolAddress=addressFromId(pool.id);
 if(poolAddress){
  const link=document.createElement('a');
  link.className='pool-link';
  link.href=
   'https://www.geckoterminal.com/bsc/pools/'+
   encodeURIComponent(poolAddress);
  link.target='_blank';
  link.rel='noopener noreferrer';
  link.textContent='View pool on GeckoTerminal';
  link.style.display='inline-block';
  link.style.marginTop='12px';
  card.append(link);
 }

 return card;
}

async function scan(){
 const button=$('scan');
 const status=$('status');
 const results=$('results');

 button.disabled=true;
 results.replaceChildren();
 status.textContent='Scanning BSC pools...';

 try{
  const responses=await Promise.allSettled(
   feeds.map(([label,path])=>loadFeed(label,path))
  );

  const unique=new Map();
  const errors=[];

  responses.forEach((result,index)=>{
   if(result.status==='rejected'){
    errors.push(
     feeds[index][0]+': '+
     result.reason.message
    );
    return;
   }

   result.value.forEach(pool=>{
    if(pool.id&&!unique.has(pool.id)){
     unique.set(pool.id,pool);
    }
   });
  });

  let excluded=0;

  const ranked=[...unique.values()]
   .map(pool=>{
    const token=identifyToken(pool);

    if(token?.excluded){
     excluded++;
     return null;
    }

    return {
     pool,
     token,
     signal:scorePool(pool)
    };
   })
   .filter(Boolean)
   .sort((a,b)=>{
    const difference=
     b.signal.score-a.signal.score;

    if(difference!==0)return difference;

    return (
     num(b.pool.attributes?.volume_usd?.h24)||0
    )-(
     num(a.pool.attributes?.volume_usd?.h24)||0
    );
   });

  const shown=ranked.slice(0,30);

  shown.forEach(item=>{
   results.append(
    render(item.pool,item.token,item.signal)
   );
  });

  status.textContent=
   'Discovered '+unique.size+' unique pools.\n'+
   'Excluded '+excluded+' major-asset pairs.\n'+
   'Ranked '+ranked.length+' pools.\n'+
   'Showing top '+shown.length+'.'+
   (errors.length
    ?'\nFeed warnings: '+errors.join('; ')
    :'');

  if(!shown.length){
   status.textContent+=
    '\nNo qualifying pools returned.';
  }

 }catch(error){
  status.textContent='Scanner error: '+error.message;
 }finally{
  button.disabled=false;
 }
}

$('scan').addEventListener('click',scan);
</script>
</body>
</html>
