
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Breakout Radar</title>
  <style>
    body {
      margin: 0;
      background: #101827;
      color: #f8fafc;
      font-family: -apple-system, sans-serif;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      margin-top: 20px;
    }
    button {
      background: #f0b90b;
      color: #111827;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>Breakout Radar</h1>
  <p>BNB Smart Chain Scanner</p>

  <div class="card">
    <h2>Scanner V1</h2>
    <p>Network: BSC Mainnet</p>
    <p>Status: Ready</p>
    <button onclick="testScanner()">
      Test Scanner
    </button>
    <p id="result"></p>
  </div>

  
<script>
async function testScanner() {
  const result = document.getElementById("result");

  result.textContent = "Scanning BSC...";

  try {
    const response = await fetch(
      "https://api.dexscreener.com/token-profiles/latest/v1"
    );

    if (!response.ok) {
      throw new Error("API error: " + response.status);
    }

    const profiles = await response.json();

    const bscTokens = profiles.filter(
      token => token.chainId === "bsc"
    );

    result.textContent =
      "API connected! Found " +
      bscTokens.length +
      " BSC token profiles in the latest batch.";

  } catch (error) {
    result.textContent =
      "Connection error: " + error.message;
  }
}
</script>

</body>
</html>
